; ============================================================
; GPU Monitor - GPU.ini (compact, 361x112 = Win10 Widgets Combo)
; Data: GPUZ-Reader.ps1 (nvidia-smi + NVAPI) -> gpu_status.txt
; gpu.lua draws the bars every update.
; ============================================================

[Rainmeter]
Update=#UpdateMs#
AccurateText=1
OnRefreshAction=[!CommandMeasure MeasureStartReader "Run"]

[Metadata]
Name=GPU Monitor
Author=Omega
Information=Compact NVIDIA GPU panel: load / VRAM / power / temperature bars.
License=MIT
Version=4.0.0

[Variables]
@Include=#@#variables.ini
Font=Microsoft JhengHei UI
White=255,255,255,255
Grey=178,178,178,255
DimGrey=130,130,130,255
Track=55,55,55,140

[MeasureStartReader]
Measure=Plugin
Plugin=RunCommand
Program=powershell
Parameter=-NoProfile -WindowStyle Hidden -ExecutionPolicy Bypass -File "#@#GPUZ-Reader.ps1"
State=Hide
OutputType=ERROR
UpdateDivider=-1

[MeasureScript]
Measure=Script
ScriptFile=#@#gpu.lua
UpdateDivider=1

; ---------- styles ----------
[sText]
FontFace=#Font#
FontSize=8
FontColor=#Grey#
AntiAlias=1
ClipString=1
H=15

[sLabel]
FontFace=#Font#
FontSize=9
FontColor=#Grey#
AntiAlias=1
X=11
W=40
H=16

[sValue]
FontFace=#Font#
FontSize=9
StringStyle=Bold
FontColor=#White#
AntiAlias=1
StringAlign=Right
ClipString=1
X=350
W=78
H=16

[sTrack]
X=52
AntiAlias=1
Shape=Rectangle 0,0,214,5,2.5 | Fill Color #Track# | StrokeWidth 0

[sFill]
X=52
AntiAlias=1
Shape=Rectangle 0,0,1,5,2.5 | Fill Color 0,0,0,0 | StrokeWidth 0

; ---------- frame ----------
[MeterBackground]
Meter=Shape
X=0
Y=0
Shape=Rectangle 0.5,0.5,360,111 | Fill Color #BackgroundColor# | Stroke Color #BorderColor# | StrokeWidth 1
AntiAlias=1

[MeterName]
Meter=String
MeterStyle=sText
X=11
Y=7
W=180
FontSize=9
StringStyle=Bold
FontColor=#AccentColor#
Text=GPU

[MeterState]
Meter=String
MeterStyle=sText
X=350
Y=8
W=200
StringAlign=Right
FontColor=#DimGrey#
Text=更新 #FreqLabel#
ToolTipText=點一下切換更新頻率 1s / 2s / 5s
LeftMouseUpAction=[!CommandMeasure MeasureScript "CycleRate()"]

; ---------- rows ----------
[MeterLoadLabel]
Meter=String
MeterStyle=sLabel
Y=26
Text=負載

[MeterLoadTrack]
Meter=Shape
MeterStyle=sTrack
Y=33

[MeterLoadFill]
Meter=Shape
MeterStyle=sFill
Y=33

[MeterLoadValue]
Meter=String
MeterStyle=sValue
Y=26
Text=--

[MeterVramLabel]
Meter=String
MeterStyle=sLabel
Y=43
Text=顯存

[MeterVramTrack]
Meter=Shape
MeterStyle=sTrack
Y=50

[MeterVramFill]
Meter=Shape
MeterStyle=sFill
Y=50

[MeterVramValue]
Meter=String
MeterStyle=sValue
Y=43
Text=--

[MeterPowerLabel]
Meter=String
MeterStyle=sLabel
Y=60
Text=功耗

[MeterPowerTrack]
Meter=Shape
MeterStyle=sTrack
Y=67

[MeterPowerFill]
Meter=Shape
MeterStyle=sFill
Y=67

[MeterPowerValue]
Meter=String
MeterStyle=sValue
Y=60
Text=--

[MeterTempLabel]
Meter=String
MeterStyle=sLabel
Y=77
Text=溫度

[MeterTempTrack]
Meter=Shape
MeterStyle=sTrack
Y=84

[MeterTempFill]
Meter=Shape
MeterStyle=sFill
Y=84

[MeterTempValue]
Meter=String
MeterStyle=sValue
Y=77
Text=--

[MeterInfo]
Meter=String
MeterStyle=sText
X=11
Y=94
W=339
FontColor=#DimGrey#
Text=
