[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=0
SkinWidth=361
SkinHeight=165
DefaultWindowX=1833
DefaultWindowY=744
ContextTitle=立即更新
ContextAction=[!CommandMeasure MeasureCollector "Run"]

[Metadata]
Name=AI Usage Panel
Author=Omega
Information=Codex weekly quota + Claude 5h/weekly plan usage as ring gauges. Outer ring = quota left, inner ring = time left. 361x165, Asia/Taipei.
License=MIT
Version=3.0.0

[Variables]
UpdatesPaused=0
; Full path if python is not on PATH, e.g. C:\Program Files\Python312\python.exe
PythonExe=python
Font=Microsoft JhengHei UI
BgColor=24,24,24,217
BorderColor=100,100,100,100
White=255,255,255,255
Grey=178,178,178,255
DimGrey=130,130,130,255
Track=55,55,55,160
CodexColor=118,185,0
ClaudeColor=217,119,87

[MeasureCollector]
Measure=Plugin
Plugin=RunCommand
Disabled=0
Program=""#PythonExe#""
Parameter=""#@#collector.py""
State=Hide
OutputType=UTF8
Timeout=25000
UpdateDivider=-1
FinishAction=[!UpdateMeasure MeasurePanel][!Redraw]

[MeasurePoll]
Measure=Calc
Formula=1
Disabled=0
UpdateDivider=60
OnUpdateAction=[!CommandMeasure MeasureCollector "Run"]

[MeasurePanel]
Measure=Script
ScriptFile=#@#panel.lua
UpdateDivider=30

; ---------- styles ----------
[sText]
FontFace=#Font#
FontSize=8
FontColor=#Grey#
AntiAlias=1
ClipString=1
H=15

[sCenter]
FontFace=#Font#
FontSize=8
FontColor=#Grey#
AntiAlias=1
ClipString=1
StringAlign=Center
W=116
H=15

[sRing]
X=0
Y=0
AntiAlias=1

[sPct]
FontFace=#Font#
FontSize=12
StringStyle=Bold
FontColor=#White#
AntiAlias=1
StringAlign=CenterCenter
Y=72

; ---------- frame ----------
[MeterBackground]
Meter=Shape
X=0
Y=0
Shape=Rectangle 0.5,0.5,360,164 | Fill Color #BgColor# | Stroke Color #BorderColor# | StrokeWidth 1
AntiAlias=1

[MeterTitle]
Meter=String
MeterStyle=sText
X=11
Y=7
W=200
FontSize=9
Text=AI 用量

[MeterUpdated]
Meter=String
MeterStyle=sText
X=350
Y=8
W=220
StringAlign=Right
FontColor=#DimGrey#
Text=更新 --:--
ToolTipText=右鍵 → 立即更新

; ---------- rings: track + time (inner) + quota (outer) ----------
; ring centres x = 60 / 180 / 300, y = 72, outer r = 31, inner r = 23
[MeterRing1Track]
Meter=Shape
MeterStyle=sRing
Shape=Ellipse 60,72,31 | Fill Color 0,0,0,0 | Stroke Color #Track# | StrokeWidth 6
Shape2=Ellipse 60,72,23 | Fill Color 0,0,0,0 | Stroke Color 55,55,55,110 | StrokeWidth 2

[MeterRing1Time]
Meter=Shape
MeterStyle=sRing
Shape=Line 0,0,0,0 | StrokeWidth 0

[MeterRing1]
Meter=Shape
MeterStyle=sRing
Shape=Line 0,0,0,0 | StrokeWidth 0

[MeterRing2Track]
Meter=Shape
MeterStyle=sRing
Shape=Ellipse 180,72,31 | Fill Color 0,0,0,0 | Stroke Color #Track# | StrokeWidth 6
Shape2=Ellipse 180,72,23 | Fill Color 0,0,0,0 | Stroke Color 55,55,55,110 | StrokeWidth 2

[MeterRing2Time]
Meter=Shape
MeterStyle=sRing
Shape=Line 0,0,0,0 | StrokeWidth 0

[MeterRing2]
Meter=Shape
MeterStyle=sRing
Shape=Line 0,0,0,0 | StrokeWidth 0

[MeterRing3Track]
Meter=Shape
MeterStyle=sRing
Shape=Ellipse 300,72,31 | Fill Color 0,0,0,0 | Stroke Color #Track# | StrokeWidth 6
Shape2=Ellipse 300,72,23 | Fill Color 0,0,0,0 | Stroke Color 55,55,55,110 | StrokeWidth 2

[MeterRing3Time]
Meter=Shape
MeterStyle=sRing
Shape=Line 0,0,0,0 | StrokeWidth 0

[MeterRing3]
Meter=Shape
MeterStyle=sRing
Shape=Line 0,0,0,0 | StrokeWidth 0

